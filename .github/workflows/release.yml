# Release builds for Windows and Linux (workflow.md section 7).
#
# Runs when a commit whose subject is exactly `release: vX.Y.Z` (or `release: vX.Y.Z-pre`) lands
# on `main`. Main is protected, so land it as a squash merge with that subject. The version must
# match `[workspace.package] version` in Cargo.toml.
#
# 1. `prepare` checks the subject and version and creates tag `vX.Y.Z` as a draft release.
# 2. `build` (Windows x64, Linux x64) builds `nemo-app` and `nemo-signin` in release mode,
#    packs them with the licence and README, and uploads the archive and its SHA-256.
# 3. `publish` makes the release public once both builds are attached. A failed build leaves
#    the draft, so nothing half-done is published.
#
# Not done here yet (section 7): code signing, the MSI/NSIS installer, the clean-VM smoke test.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version from the commit subject
        id: ver
        shell: pwsh
        env:
          # Passed through env, never pasted into the script, so the message cannot inject code.
          MSG: ${{ github.event.head_commit.message }}
        run: |
          $subject = ($env:MSG -split "`r?`n")[0].Trim()
          if ($subject -notmatch '^release: v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') {
            throw "Commit subject must be 'release: vX.Y.Z', got: $subject"
          }
          $version = $Matches[1]
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "No version in Cargo.toml" }
          if ($Matches[1] -ne $version) {
            throw "Cargo.toml version $($Matches[1]) does not match release v$version"
          }
          if (git ls-remote --tags origin "refs/tags/v$version") { throw "Tag v$version already exists" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $notes = @"
          NemoMusic v$env:VERSION for Windows x64 and Linux x64 (unsigned, early development).

          Windows: unzip and run ``nemo-app.exe``; keep ``nemo-signin.exe`` next to it.
          Linux: untar and run ``./nemo-app``; keep ``nemo-signin`` next to it. Needs the GTK 3,
          WebKitGTK 4.1, libsoup 3, ALSA and OpenSSL runtime libraries, and a Secret Service
          keyring for sign-in.
          YouTube playback needs [yt-dlp](https://github.com/yt-dlp/yt-dlp) on PATH.

          NemoMusic is not made, approved or supported by Google or YouTube. It uses YouTube Music
          without an official API, which may break the YouTube Terms of Service; your account could
          be limited. YouTube streams are lossy; the badge never calls them lossless.
          "@
          gh release create "v$env:VERSION" --draft --target $env:GITHUB_SHA `
            --title "NemoMusic v$env:VERSION" --notes $notes

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same packages as README "Linux" and ci.yml (cpal ALSA, the sign-in window, OpenSSL).
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libxdo-dev libssl-dev cmake

      # With no argument, rustup installs the channel and components from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      # CMake for libopus ships on the windows-latest image; Linux gets it from apt above.
      - name: Build
        run: cargo build --release --locked -p nemo-app -p nemo-signin

      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "NemoMusic-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/nemo-app.exe, target/release/nemo-signin.exe, LICENSE, README.md $name
            $archive = "$name.zip"
            Compress-Archive -Path $name -DestinationPath $archive
          } else {
            Copy-Item target/release/nemo-app, target/release/nemo-signin, LICENSE, README.md $name
            $archive = "$name.tar.gz"
            # tar keeps the executable bit, which a zip made here would drop.
            tar -czf $archive $name
            if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
          gh release upload "v$env:VERSION" $archive "$archive.sha256"

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
