# CI for NemoMusic. Runs the Definition of Done from .kiro/steering/workflow.md
# section 4 and the checks that .kiro/steering/code.md asks for (Toolchain,
# Format and lint, Dependencies).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository. No secrets are used.
permissions:
  contents: read

# Cancel a superseded run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests do not need debug info; full debug info also ran link.exe out of memory.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Linux build packages, see .kiro/steering/tech.md ("Linux build packages").
  LINUX_PACKAGES: pkg-config libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev

jobs:
  # code.md "Format and lint" and workflow.md section 4: fmt, clippy, tests on both OSes.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      # With no argument, rustup installs the channel and components from rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Includes `nemo-audio --test bit_exact` and `rt_no_alloc`.
      - name: Test
        run: cargo test --workspace --all-features

  # code.md "Toolchain": CI builds with the MSRV and with latest stable.
  toolchains:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.97 is `rust-version` in the workspace Cargo.toml.
        toolchain: ["1.97", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - name: Install ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
      - name: Check
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets --all-features

  # code.md "Dependencies": `cargo deny check` and `cargo audit` must both pass.
  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
