[package]
name = "nemo-audio"
description = "Decode, ring buffer, device output, gapless playback and signal-path report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Deviation from `[lints] workspace = true`: the workspace forbids `unsafe_code`, but the
# counting `#[global_allocator]` in tests/rt_no_alloc.rs needs an `unsafe impl GlobalAlloc`.
# These tables copy the workspace lints; only `unsafe_code` is `deny` instead of `forbid`, so
# that one test file can opt in with `#![allow(unsafe_code)]`. Library code has no unsafe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[dependencies]
nemo-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "wav", "pcm", "isomp4", "aac", "mkv", "mp3"] }
rtrb = "=0.4.1"
cpal = { version = "=0.18.2", default-features = false }


rubato = { version = "=5.0.1", default-features = false }
