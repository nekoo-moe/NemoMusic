[package]
name = "nemo-app"
description = "NemoMusic application binary: wiring, config, logging and startup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nemo-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
serde.workspace = true
serde_json.workspace = true
nemo-audio.workspace = true
nemo-ytm.workspace = true
nemo-lyrics.workspace = true
nemo-library.workspace = true
nemo-secrets.workspace = true
# The sign-in window, run in its own process as `nemo-app --signin` (tech.md, Sign-in window).
nemo-signin = { path = "../nemo-signin" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time"] }
nemo-ui = { workspace = true, features = ["gui"] }
# The native folder dialog for `Add a folder` (tech.md, Folder picker). Linux uses the XDG desktop
# portal (`gtk3` cannot be used: rfd 0.18 needs gtk-sys 0.19 and wry already links gtk-sys 0.18,
# and Cargo allows one `links = "gtk-3"` package); Windows uses its own native dialog.
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }

# Mica or acrylic blur behind the see-through window (Windows only; tech.md, Window blur).
[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.1"
