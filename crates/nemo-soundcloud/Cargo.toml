[package]
name = "nemo-soundcloud"
description = "SoundCloud as a second source: web API v2 client, catalog, stream lookup and HLS reader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nemo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Same versions and features as `nemo-ytm` (soundcloud-full design): `native-tls` needs no cmake
# or NASM on Windows. Async client, run on the app runtime.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
# Decodes the recorded AAC segments in the HLS tests (the same dev-dependency `nemo-ytm` has).
nemo-audio.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }
