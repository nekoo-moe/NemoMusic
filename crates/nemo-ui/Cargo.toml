[package]
name = "nemo-ui"
description = "User interface: theme tokens, views, widgets and album-art effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Everything iced-related is behind this feature so `cargo clippy --workspace` stays fast.
gui = ["dep:iced", "dep:iced_test"]

[dependencies]
nemo-core.workspace = true
thiserror.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
iced = { version = "=0.14.0", optional = true, default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "image", "svg", "advanced"] }
# Headless rendering for snapshot PNGs (same project as iced; tiny-skia renderer, no GPU).
iced_test = { version = "=0.14.0", optional = true, default-features = false }

# Linux needs a window backend; `default-features = false` above turns both off.
# Cargo unifies these features with the entry above when `gui` is on.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "=0.14.0", optional = true, default-features = false, features = ["x11", "wayland"] }

[[example]]
name = "glass_spike"
required-features = ["gui"]

[[example]]
name = "ui_mock"
required-features = ["gui"]

[[example]]
name = "snapshots"
required-features = ["gui"]
