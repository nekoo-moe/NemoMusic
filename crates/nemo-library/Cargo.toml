[package]
name = "nemo-library"
description = "Local music library: folder scan, tags and SQLite storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nemo-core.workspace = true
serde_json.workspace = true
# NFKC for playlist-import matching, the version nemo-lyrics already builds.
unicode-normalization = { version = "=0.1.26", default-features = false }
# lofty 0.25.5 does not compile with default-features = false (missing Id3v2Error import),
# so the default id3v2 compression feature stays on.
lofty = "=0.25.5"
# The library database, library.db (local-library design), the same SQLite build as nemo-lyrics.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
