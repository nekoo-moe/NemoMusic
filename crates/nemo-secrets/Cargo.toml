[package]
name = "nemo-secrets"
description = "The OS credential store: Windows Credential Manager and the Linux Secret Service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nemo-core.workspace = true
# OS credential store (tech.md, Credential store row). `keyring-core` is the store API; the
# backend is per platform below.
keyring-core = { version = "=1.0.1", default-features = false }

# Windows Credential Manager.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

# Linux Secret Service (GNOME Keyring, KWallet) over D-Bus. Pure Rust (`zbus`), no libdbus.
# `crypto-rust` only: zbus then runs its own executor thread, so the blocking calls are safe
# from inside the app's tokio runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
# `MemoryStore` for the `ScopedStore` tests.
nemo-core = { workspace = true, features = ["test-util"] }
